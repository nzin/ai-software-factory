# TLS termination in front of the self-hosted Kodus API (see docker-compose.yml
# service `kodus-tls-proxy`). The Kodus CLI refuses a non-localhost KODUS_API_URL
# unless it's HTTPS, so agent-code-reviewer talks to this instead of kodus_api
# directly.
server {
    listen 3443 ssl;
    server_name kodus-tls-proxy;

    ssl_certificate     /etc/nginx/certs/kodus-tls-proxy.crt;
    ssl_certificate_key /etc/nginx/certs/kodus-tls-proxy.key;

    location / {
        proxy_pass http://kodus_api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
