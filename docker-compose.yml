# The AI Software Factory itself: catalog + coordinator + the agent roster.
#
#   make up          # build + start the factory
#   make kodus-up    # start the self-hosted Kodus stack (separate compose, see
#                    # scripts/kodus-setup.md); the code-reviewer reaches its API
#                    # via KODUS_API_URL (default http://host.docker.internal:3001)
#
# Requires ANTHROPIC_API_KEY in .env (see .env.example).
#
# Per-run working trees live in the `factory-workspace` named volume and are
# disposable. `./local_git` is bind-mounted into the coordinator as a git remote:
# the factory clones a target repo from it and pushes the `asf/run-<id>` branch
# back, so only real history persists on the host. `make up` creates the shared
# repo ./local_git/project that empty-repoURL runs clone.

name: ai-software-factory

x-agent: &agent
  build:
    context: .
    dockerfile: Dockerfile
  image: ai-software-factory-base:latest
  restart: unless-stopped
  environment:
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
    ASF_CATALOG_URL: http://catalog:8080
    ASF_WORKSPACE_ROOT: /workspace
  volumes:
    - factory-workspace:/workspace
  networks: [factory-net]
  depends_on:
    catalog:
      condition: service_healthy

services:
  catalog:
    build: { context: ., dockerfile: Dockerfile }
    image: ai-software-factory-base:latest
    command: ["/app/bin/catalog", "--addr", ":8080", "--db", "/data/catalog.db"]
    restart: unless-stopped
    volumes:
      - catalog-data:/data
    networks: [factory-net]
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 3s
      timeout: 2s
      retries: 20

  coordinator:
    <<: *agent
    command: ["/app/bin/coordinator", "serve", "--addr", ":8090", "--runstore", "/data/runs.db"]
    ports: ["8090:8090"]
    volumes:
      - factory-workspace:/workspace
      # local_git is a git remote, not a workspace: the coordinator clones from it
      # and pushes run branches back. Only the coordinator needs it.
      - ./local_git:/var/lib/asf/local_git
      - coordinator-data:/data
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      ASF_CATALOG_URL: http://catalog:8080
      ASF_WORKSPACE_ROOT: /workspace
      # A PRD submitted with an empty repoURL is cloned from this shared repo
      # (created by `make up`) instead of scaffolding a throwaway one.
      ASF_DEFAULT_REPO: /var/lib/asf/local_git/project
      # Bare-name repoURLs (e.g. "demo") resolve to <root>/<name> here and are
      # auto-git-init'd on first use.
      ASF_LOCAL_GIT_ROOT: /var/lib/asf/local_git
      ASF_RUNSTORE: /data/runs.db
      ASF_BASE_BRANCH: ${ASF_BASE_BRANCH:-main}
      # Optional: open a GitHub PR when a run targets a github.com remote.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Optional: shared secret for POST /v1/webhooks/github (see scripts/github-webhook.md).
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}

  agent-planner:
    <<: *agent
    command: ["/app/bin/agent-planner", "--addr", ":9101", "--public-url", "http://agent-planner:9101"]

  agent-ui-ux-designer:
    <<: *agent
    command: ["/app/bin/agent-ui-ux-designer", "--addr", ":9102", "--public-url", "http://agent-ui-ux-designer:9102"]

  agent-backend-developer:
    <<: *agent
    command: ["/app/bin/agent-backend-developer", "--addr", ":9103", "--public-url", "http://agent-backend-developer:9103"]

  agent-frontend-developer:
    <<: *agent
    command: ["/app/bin/agent-frontend-developer", "--addr", ":9104", "--public-url", "http://agent-frontend-developer:9104"]

  agent-mobile-developer:
    <<: *agent
    command: ["/app/bin/agent-mobile-developer", "--addr", ":9105", "--public-url", "http://agent-mobile-developer:9105"]

  agent-test-engineer:
    <<: *agent
    command: ["/app/bin/agent-test-engineer", "--addr", ":9109", "--public-url", "http://agent-test-engineer:9109"]

  agent-build-gate:
    <<: *agent
    build:
      context: .
      dockerfile: Dockerfile.buildgate
    image: ai-software-factory-buildgate:latest
    command: ["/app/bin/agent-build-gate", "--addr", ":9108", "--public-url", "http://agent-build-gate:9108"]
    # The gate runs `docker compose up` for the component tests against the host
    # daemon. This gives LLM-authored Dockerfiles/compose files control of that
    # daemon — run the factory in a disposable VM. Mitigations: per-run compose
    # project name + unconditional teardown, and a hard timeout in the gate.
    volumes:
      - factory-workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock

  agent-security-reviewer:
    <<: *agent
    build:
      context: .
      dockerfile: Dockerfile.secreview
    image: ai-software-factory-secreview:latest
    command: ["/app/bin/agent-security-reviewer", "--addr", ":9106", "--public-url", "http://agent-security-reviewer:9106"]

  agent-code-reviewer:
    <<: *agent
    build:
      context: .
      dockerfile: Dockerfile.codereview
    image: ai-software-factory-codereview:latest
    command: ["/app/bin/agent-code-reviewer", "--addr", ":9107", "--public-url", "http://agent-code-reviewer:9107"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?}
      ASF_CATALOG_URL: http://catalog:8080
      ASF_WORKSPACE_ROOT: /workspace
      # Self-hosted Kodus API (started separately via `make kodus-up`).
      KODUS_API_URL: ${KODUS_API_URL:-http://host.docker.internal:3001}
      KODUS_TEAM_KEY: ${KODUS_TEAM_KEY:-}

networks:
  factory-net:
    name: factory-net

volumes:
  factory-workspace:
  catalog-data:
  coordinator-data:
