swagger: "2.0"
info:
  title: AI Software Factory - Coordinator
  description: >
    The coordinator accepts a PRD (Product Requirements Definition), discovers
    the specialized agents through the catalog, and drives a run to produce an
    implementation plan (Phase 1) and later a Pull Request. Each run carries a
    TTL / budget so it can never loop forever.
  version: 0.1.0
basePath: /
consumes:
  - application/json
produces:
  - application/json
schemes:
  - http

paths:
  /healthz:
    get:
      tags: [health]
      operationId: health
      summary: Liveness probe
      responses:
        200:
          description: service is healthy
          schema:
            $ref: "#/definitions/Health"

  /v1/prd:
    post:
      tags: [runs]
      operationId: submitPRD
      summary: Submit a PRD; the factory runs it in the background
      description: >
        Returns immediately with the run in its initial state. Poll
        GET /v1/runs/{id} for progress. A run may pause at
        status=awaiting_approval — resume it with POST /v1/runs/{id}/approve.
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/SubmitPRDRequest"
      responses:
        202:
          description: the run was accepted and started
          schema:
            $ref: "#/definitions/Run"
        default:
          description: error
          schema:
            $ref: "#/definitions/Error"

  /v1/runs:
    get:
      tags: [runs]
      operationId: listRuns
      summary: List all runs
      responses:
        200:
          description: the runs
          schema:
            type: array
            items:
              $ref: "#/definitions/RunSummary"
        default:
          description: error
          schema:
            $ref: "#/definitions/Error"

  /v1/runs/{id}:
    get:
      tags: [runs]
      operationId: getRun
      summary: Get one run
      parameters:
        - name: id
          in: path
          required: true
          type: string
      responses:
        200:
          description: the run
          schema:
            $ref: "#/definitions/Run"
        404:
          description: no such run
          schema:
            $ref: "#/definitions/Error"
        default:
          description: error
          schema:
            $ref: "#/definitions/Error"
    delete:
      tags: [runs]
      operationId: deleteRun
      summary: Delete a terminal run and its workspace
      parameters:
        - name: id
          in: path
          required: true
          type: string
      responses:
        204:
          description: deleted
        404:
          description: no such run
          schema:
            $ref: "#/definitions/Error"
        default:
          description: error
          schema:
            $ref: "#/definitions/Error"

  /v1/runs/{id}/screenshot:
    get:
      tags: [runs]
      operationId: getRunScreenshot
      summary: Fetch a Playwright screenshot written during the run, by its repo-relative path
      description: >
        `path` must be one of the run's recorded filesWritten entries under
        test/e2e/screenshots/ — anything else is rejected.
      produces:
        - image/png
      parameters:
        - name: id
          in: path
          required: true
          type: string
        - name: path
          in: query
          required: true
          type: string
      responses:
        200:
          description: the screenshot
          schema:
            type: file
        400:
          description: invalid path
          schema:
            $ref: "#/definitions/Error"
        404:
          description: no such run or file
          schema:
            $ref: "#/definitions/Error"

  /v1/runs/{id}/approve:
    post:
      tags: [runs]
      operationId: approveRun
      summary: Approve the plan and resume a run paused at the approval gate
      parameters:
        - name: id
          in: path
          required: true
          type: string
      responses:
        200:
          description: the resumed run
          schema:
            $ref: "#/definitions/Run"
        default:
          description: error
          schema:
            $ref: "#/definitions/Error"

  /v1/runs/{id}/reject:
    post:
      tags: [runs]
      operationId: rejectRun
      summary: Reject the plan; replan with feedback, or abandon the run
      parameters:
        - name: id
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: false
          schema:
            $ref: "#/definitions/RejectRequest"
      responses:
        200:
          description: the run
          schema:
            $ref: "#/definitions/Run"
        default:
          description: error
          schema:
            $ref: "#/definitions/Error"

  /v1/runs/{id}/resume:
    post:
      tags: [runs]
      operationId: resumeRun
      summary: Restart a run parked in needs_human_review or failed
      description: >
        Grants fresh budget and re-dispatches. With "comment" the note is
        recorded as a high-severity finding and routed to the responsible
        developer for a fix pass. With "accept" the run's branch is taken as-is
        (pushed / PR opened) and the run stops. With "abandon" the run is failed.
      parameters:
        - name: id
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: false
          schema:
            $ref: "#/definitions/ResumeRequest"
      responses:
        200:
          description: the run
          schema:
            $ref: "#/definitions/Run"
        default:
          description: error
          schema:
            $ref: "#/definitions/Error"

  /v1/runs/{id}/review:
    post:
      tags: [runs]
      operationId: reviewRun
      summary: Human verdict on a finished run — accept it, or send it back with comments
      description: >
        Valid from status pr_ready or pr_open. "accept" (re-)pushes the work
        branch to origin, opens the PR when the remote is GitHub and a token is
        set, and is terminal. With "request_changes" every comment becomes a
        Finding{source:"human"} and the run re-enters the factory at the
        responsible developer.
      parameters:
        - name: id
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/ReviewRequest"
      responses:
        200:
          description: the run
          schema:
            $ref: "#/definitions/Run"
        default:
          description: error
          schema:
            $ref: "#/definitions/Error"

  /v1/agents:
    get:
      tags: [agents]
      operationId: listAgents
      summary: The agent roster, read through from the catalog
      responses:
        200:
          description: the registered agents
          schema:
            type: array
            items:
              $ref: "#/definitions/AgentInfo"
        default:
          description: error
          schema:
            $ref: "#/definitions/Error"

  /v1/agents/{role}:
    get:
      tags: [agents]
      operationId: getAgentDetail
      summary: One agent's registration, model config and assembled A2A AgentCard
      parameters:
        - name: role
          in: path
          required: true
          type: string
      responses:
        200:
          description: the agent
          schema:
            $ref: "#/definitions/AgentDetail"
        404:
          description: no such agent
          schema:
            $ref: "#/definitions/Error"
        default:
          description: error
          schema:
            $ref: "#/definitions/Error"

  /v1/webhooks/github:
    post:
      tags: [webhooks]
      operationId: githubWebhook
      summary: GitHub pull-request review webhook
      description: >
        Verifies the X-Hub-Signature-256 HMAC, then turns a PR review or an
        inline review comment into the same re-entry the in-UI review does:
        a change request becomes a Finding{source:"human"} routed to the
        responsible developer; an approval accepts the run. There is no request
        body schema here on purpose — the handler reads the raw body itself for
        signature verification.
      responses:
        202:
          description: accepted (also returned for ignored / unmatched events)
        401:
          description: bad or missing signature
          schema:
            $ref: "#/definitions/Error"
        503:
          description: webhooks not configured (GITHUB_WEBHOOK_SECRET unset)
          schema:
            $ref: "#/definitions/Error"
        default:
          description: error
          schema:
            $ref: "#/definitions/Error"

definitions:
  Health:
    type: object
    required: [status]
    properties:
      status:
        type: string
        example: ok

  Error:
    type: object
    required: [message]
    properties:
      message:
        type: string

  PlanTask:
    type: object
    properties:
      id:
        type: string
      role:
        type: string
      title:
        type: string
      details:
        type: string

  PRD:
    type: object
    required: [title]
    properties:
      title:
        type: string
      description:
        type: string
      acceptanceCriteria:
        type: array
        items:
          type: string

  SubmitPRDRequest:
    type: object
    properties:
      prd:
        $ref: "#/definitions/PRD"
      markdown:
        type: string
        description: raw markdown PRD; used when prd is not provided
      repoURL:
        type: string
        description: >
          target repository. Empty = a new local repo. file:///abs/path or a
          bare path = an existing local repo (cloned from; branch pushed back).
          A name with no path separators (e.g. "demo") resolves to, and
          auto-creates on first use, <local-git-root>/<name> — then behaves
          like an existing local repo. https/git/ssh URL = a remote repo
          (cloned; branch pushed + PR opened if GITHUB_TOKEN is set).
      baseBranch:
        type: string
        description: branch to base the work on (default main)
      iterationBudget:
        type: integer
        description: override the default per-run iteration budget
      deadlineSeconds:
        type: integer
        description: override the default per-run wall-clock budget, in seconds

  RejectRequest:
    type: object
    properties:
      feedback:
        type: string
        description: notes for the planner's next attempt
      abandon:
        type: boolean
        description: if true, abandon the run instead of replanning

  ResumeRequest:
    type: object
    properties:
      iterationBudget:
        type: integer
        description: extra iterations to grant (0 = the server default top-up)
      deadlineSeconds:
        type: integer
        description: extra wall-clock to grant, in seconds (0 = the server default)
      abandon:
        type: boolean
        description: if true, abandon the run instead of resuming it
      accept:
        type: boolean
        description: >
          accept the run's branch as-is — push it / open the PR and stop,
          skipping the remaining pipeline stages
      comment:
        type: string
        description: >
          human guidance; recorded as a high-severity finding and routed to the
          responsible developer for a fix pass on resume
      targetRole:
        type: string
        description: developer the comment routes to; inferred when empty

  ReviewComment:
    type: object
    required: [note]
    properties:
      note:
        type: string
        description: what needs to change
      targetRole:
        type: string
        description: developer who should fix it; inferred when empty
      file:
        type: string
      line:
        type: integer

  ReviewRequest:
    type: object
    required: [decision]
    properties:
      decision:
        type: string
        enum: [accept, request_changes]
      comments:
        type: array
        description: required (and non-empty) when decision is request_changes
        items:
          $ref: "#/definitions/ReviewComment"

  ModelConfig:
    type: object
    properties:
      provider:
        type: string
      model:
        type: string
      maxTokens:
        type: integer
        format: int64
      effort:
        type: string
      thinking:
        type: string
      params:
        type: object
        additionalProperties: true

  AgentInfo:
    type: object
    properties:
      role:
        type: string
      name:
        type: string
      description:
        type: string
      baseURL:
        type: string
      transport:
        type: string
      skills:
        type: array
        items:
          type: string
      concurrency:
        type: integer
      enabled:
        type: boolean
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time
      model:
        $ref: "#/definitions/ModelConfig"

  AgentDetail:
    type: object
    properties:
      info:
        $ref: "#/definitions/AgentInfo"
      model:
        $ref: "#/definitions/ModelConfig"
      agentCard:
        type: object
        additionalProperties: true
        description: the assembled A2A AgentCard (free-form; mirrors a2a.AgentCard)

  RunEvent:
    type: object
    description: one entry in a run's durable audit log
    properties:
      seq:
        type: integer
      at:
        type: string
        format: date-time
      kind:
        type: string
        description: submitted | stage_started | stage_completed | stage_failed | plan_ready | awaiting_approval | approved | rejected | request_changes | build_failed | pr_comment | attempt_cap | budget_exhausted | pushed | pr_opened | review_accepted | review_changes_requested | resumed | recovered | finished | truncated
      stage:
        type: string
      status:
        type: string
        description: the run's status right after this event
      message:
        type: string
      detail:
        type: string
      attempt:
        type: integer
      durationMs:
        type: integer
        format: int64
      actor:
        type: string
        enum: ["", system, human]

  ApprovalDecision:
    type: object
    properties:
      required:
        type: boolean
      reason:
        type: string

  RunSummary:
    type: object
    properties:
      id:
        type: string
      status:
        type: string
      stage:
        type: string
      title:
        type: string
      repoURL:
        type: string
      repoKind:
        type: string
      workBranch:
        type: string
      prURL:
        type: string
      iterationsRemaining:
        type: integer
      deadline:
        type: string
        format: date-time
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time

  Finding:
    type: object
    properties:
      source:
        type: string
        description: kodus | gosec | govulncheck | npm-audit | security-reviewer | human
      severity:
        type: string
        enum: ["", critical, high, medium, low, info]
      category:
        type: string
      file:
        type: string
      line:
        type: integer
      title:
        type: string
      suggestion:
        type: string
      evidence:
        type: string
        description: verbatim excerpt of the actual failure the title/suggestion were derived from
      targetRole:
        type: string

  Task:
    type: object
    description: one agent dispatch, with what that step produced
    properties:
      role:
        type: string
      taskID:
        type: string
      state:
        type: string
      summary:
        type: string
      commitSha:
        type: string
      output:
        type: string
      attempt:
        type: integer
      startedAt:
        type: string
        format: date-time
      durationMs:
        type: integer
        format: int64
      verdict:
        type: string
      filesWritten:
        type: array
        items:
          type: string
      findings:
        type: array
        description: the findings this step produced
        items:
          $ref: "#/definitions/Finding"

  Run:
    type: object
    required: [id, status]
    properties:
      id:
        type: string
      contextID:
        type: string
      status:
        type: string
        enum: [queued, running, awaiting_approval, pr_ready, pr_open, accepted, changes_requested, needs_human_review, failed, done]
      stage:
        type: string
      lastStage:
        type: string
        description: the stage the run stopped in; where resume picks it back up
      reason:
        type: string
        description: why the run stopped / is paused
      repoURL:
        type: string
      repoKind:
        type: string
        enum: ["", new, local, remote]
      baseBranch:
        type: string
      workBranch:
        type: string
      workspaceDir:
        type: string
      prURL:
        type: string
      approval:
        $ref: "#/definitions/ApprovalDecision"
      attempts:
        type: object
        additionalProperties:
          type: integer
      iterationsRemaining:
        type: integer
      deadline:
        type: string
        format: date-time
      plan:
        type: string
      uiSpec:
        type: string
      planTasks:
        type: array
        items:
          $ref: "#/definitions/PlanTask"
      findings:
        type: array
        items:
          $ref: "#/definitions/Finding"
      tasks:
        type: array
        items:
          $ref: "#/definitions/Task"
      events:
        type: array
        description: the run's durable audit log, oldest first
        items:
          $ref: "#/definitions/RunEvent"
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time
