swagger: "2.0"
info:
  title: AI Software Factory - Coordinator
  description: >
    The coordinator accepts a PRD (Product Requirements Definition), discovers
    the specialized agents through the catalog, and drives a run to produce an
    implementation plan (Phase 1) and later a Pull Request. Each run carries a
    TTL / budget so it can never loop forever.
  version: 0.1.0
basePath: /
consumes:
  - application/json
produces:
  - application/json
schemes:
  - http

paths:
  /healthz:
    get:
      tags: [health]
      operationId: health
      summary: Liveness probe
      responses:
        200:
          description: service is healthy
          schema:
            $ref: "#/definitions/Health"

  /v1/prd:
    post:
      tags: [runs]
      operationId: submitPRD
      summary: Submit a PRD; the factory runs it in the background
      description: >
        Returns immediately with the run in its initial state. Poll
        GET /v1/runs/{id} for progress. A run may pause at
        status=awaiting_approval — resume it with POST /v1/runs/{id}/approve.
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/SubmitPRDRequest"
      responses:
        202:
          description: the run was accepted and started
          schema:
            $ref: "#/definitions/Run"
        default:
          description: error
          schema:
            $ref: "#/definitions/Error"

  /v1/runs:
    get:
      tags: [runs]
      operationId: listRuns
      summary: List all runs
      responses:
        200:
          description: the runs
          schema:
            type: array
            items:
              $ref: "#/definitions/RunSummary"
        default:
          description: error
          schema:
            $ref: "#/definitions/Error"

  /v1/runs/{id}:
    get:
      tags: [runs]
      operationId: getRun
      summary: Get one run
      parameters:
        - name: id
          in: path
          required: true
          type: string
      responses:
        200:
          description: the run
          schema:
            $ref: "#/definitions/Run"
        404:
          description: no such run
          schema:
            $ref: "#/definitions/Error"
        default:
          description: error
          schema:
            $ref: "#/definitions/Error"

  /v1/runs/{id}/approve:
    post:
      tags: [runs]
      operationId: approveRun
      summary: Approve the plan and resume a run paused at the approval gate
      parameters:
        - name: id
          in: path
          required: true
          type: string
      responses:
        200:
          description: the resumed run
          schema:
            $ref: "#/definitions/Run"
        default:
          description: error
          schema:
            $ref: "#/definitions/Error"

  /v1/runs/{id}/reject:
    post:
      tags: [runs]
      operationId: rejectRun
      summary: Reject the plan; replan with feedback, or abandon the run
      parameters:
        - name: id
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: false
          schema:
            $ref: "#/definitions/RejectRequest"
      responses:
        200:
          description: the run
          schema:
            $ref: "#/definitions/Run"
        default:
          description: error
          schema:
            $ref: "#/definitions/Error"

definitions:
  Health:
    type: object
    required: [status]
    properties:
      status:
        type: string
        example: ok

  Error:
    type: object
    required: [message]
    properties:
      message:
        type: string

  PlanTask:
    type: object
    properties:
      id:
        type: string
      role:
        type: string
      title:
        type: string
      details:
        type: string

  PRD:
    type: object
    required: [title]
    properties:
      title:
        type: string
      description:
        type: string
      acceptanceCriteria:
        type: array
        items:
          type: string

  SubmitPRDRequest:
    type: object
    properties:
      prd:
        $ref: "#/definitions/PRD"
      markdown:
        type: string
        description: raw markdown PRD; used when prd is not provided
      repoURL:
        type: string
        description: >
          target repository. Empty = a new local repo. file:///abs/path or a
          bare path = an existing local repo (worked on via git worktree).
          https/git/ssh URL = a remote repo (cloned; branch pushed + PR opened
          if GITHUB_TOKEN is set).
      baseBranch:
        type: string
        description: branch to base the work on (default main)
      iterationBudget:
        type: integer
        description: override the default per-run iteration budget
      deadlineSeconds:
        type: integer
        description: override the default per-run wall-clock budget, in seconds

  RejectRequest:
    type: object
    properties:
      feedback:
        type: string
        description: notes for the planner's next attempt
      abandon:
        type: boolean
        description: if true, abandon the run instead of replanning

  ApprovalDecision:
    type: object
    properties:
      required:
        type: boolean
      reason:
        type: string

  RunSummary:
    type: object
    properties:
      id:
        type: string
      status:
        type: string
      stage:
        type: string
      title:
        type: string
      repoURL:
        type: string
      prURL:
        type: string
      iterationsRemaining:
        type: integer
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time

  Finding:
    type: object
    properties:
      source:
        type: string
        description: kodus | gosec | govulncheck | npm-audit | security-reviewer | human
      severity:
        type: string
        enum: ["", critical, high, medium, low, info]
      category:
        type: string
      file:
        type: string
      line:
        type: integer
      title:
        type: string
      suggestion:
        type: string
      targetRole:
        type: string

  Task:
    type: object
    properties:
      role:
        type: string
      taskID:
        type: string
      state:
        type: string
      summary:
        type: string
      commitSha:
        type: string
      output:
        type: string

  Run:
    type: object
    required: [id, status]
    properties:
      id:
        type: string
      contextID:
        type: string
      status:
        type: string
        enum: [queued, running, awaiting_approval, pr_ready, pr_open, accepted, changes_requested, needs_human_review, failed, done]
      stage:
        type: string
      reason:
        type: string
        description: why the run stopped / is paused
      repoURL:
        type: string
      repoKind:
        type: string
        enum: ["", new, local, remote]
      baseBranch:
        type: string
      workBranch:
        type: string
      workspaceDir:
        type: string
      prURL:
        type: string
      approval:
        $ref: "#/definitions/ApprovalDecision"
      attempts:
        type: object
        additionalProperties:
          type: integer
      iterationsRemaining:
        type: integer
      deadline:
        type: string
        format: date-time
      plan:
        type: string
      uiSpec:
        type: string
      planTasks:
        type: array
        items:
          $ref: "#/definitions/PlanTask"
      findings:
        type: array
        items:
          $ref: "#/definitions/Finding"
      tasks:
        type: array
        items:
          $ref: "#/definitions/Task"
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time
